<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />

    <title>StockScout — Find What's In Stock Near You</title>
    <meta
      name="description"
      content="StockScout uses AI to find which local stores stock the product you want — with live-style availability, prices, opening hours and one-tap directions."
    />
    <meta name="keywords" content="product stock finder, local inventory, in stock near me, store availability, AI shopping assistant" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockScout — Find What's In Stock Near You" />
    <meta property="og:description" content="AI-powered local stock lookup. Search a product, pick your area, and see which nearby stores have it." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c2ee36'/%3E%3Cpath d='M10 21.5V13a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1Z' fill='none' stroke='%23101214' stroke-width='2'/%3E%3Cpath d='M13 12V10.5a3 3 0 0 1 6 0V12' fill='none' stroke='%23101214' stroke-width='2'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('stockscout:theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
